        // Utility to escape HTML in option text
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        // Random selection: choose count unique random questions from the pool
        function pickRandomQuestions(pool, count) {
            const arr = pool.slice();
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr.slice(0, count);
        }

        // selectedQuestions is mutable so Refresh can replace it
        let selectedQuestions = pickRandomQuestions(allQuestions, 10);
        let userAnswers = Array(selectedQuestions.length).fill(null);

        function buildQuiz() {
            const quizContainer = document.getElementById('quiz');
            quizContainer.innerHTML = '';

            selectedQuestions.forEach((q, idx) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question';
                questionDiv.innerHTML = `
                    <h3>${idx + 1}. ${q.question}</h3>
                    <div class="options">
                        ${q.options.map((option, i) => `
                            <div class="option" data-q="${idx}" data-o="${i}">${escapeHtml(option)}</div>
                        `).join('')}
                    </div>
                    <div class="feedback" id="feedback-${idx}"></div>
                `;
                quizContainer.appendChild(questionDiv);
            });

            // attach listeners to options
            document.querySelectorAll('.option').forEach(option => {
                option.addEventListener('click', function() {
                    const qIndex = parseInt(this.getAttribute('data-q'), 10);
                    const oIndex = parseInt(this.getAttribute('data-o'), 10);
                    userAnswers[qIndex] = oIndex;

                    document.querySelectorAll(`.option[data-q="${qIndex}"]`).forEach(el => el.classList.remove('selected'));
                    this.classList.add('selected');

                    const fb = document.getElementById(`feedback-${qIndex}`);
                    if (fb) fb.style.display = 'none';
                    document.getElementById('results').style.display = 'none';
                });
            });
        }

        function submitQuiz() {
            let score = 0;
            selectedQuestions.forEach((q, idx) => {
                const feedbackEl = document.getElementById(`feedback-${idx}`);
                const user = userAnswers[idx];
                if (user === q.answer) {
                    score++;
                    feedbackEl.className = 'feedback correct';
                    feedbackEl.textContent = "Correct!";
                } else {
                    feedbackEl.className = 'feedback incorrect';
                    const correctText = q.options[q.answer];
                    const chosenText = (user === null) ? "(no answer)" : q.options[user];
                    feedbackEl.textContent = `Incorrect. Your answer: ${chosenText}. Correct answer: ${correctText}.`;
                }
                feedbackEl.style.display = 'block';
            });

            const resultsEl = document.getElementById('results');
            resultsEl.innerHTML = `
                <h3>Quiz Results</h3>
                <p>You scored ${score} out of ${selectedQuestions.length}.</p>
                <p class="small">Use Refresh to try another random set of questions.</p>
            `;
            resultsEl.style.display = 'block';
            resultsEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // Refresh: pick a new set of questions and rebuild the UI
        function refreshQuestions() {
            selectedQuestions = pickRandomQuestions(allQuestions, 10);
            userAnswers = Array(selectedQuestions.length).fill(null);
            // hide results and feedback
            document.getElementById('results').style.display = 'none';
            buildQuiz();
            // scroll to top of quiz
            document.getElementById('quiz').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        document.getElementById('submit').addEventListener('click', submitQuiz);
        document.getElementById('refresh').addEventListener('click', refreshQuestions);

        // Build the first quiz on load
        buildQuiz();
    
</script>
